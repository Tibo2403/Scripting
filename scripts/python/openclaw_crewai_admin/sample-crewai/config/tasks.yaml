market_research:
  description: >
    Rechercher les tendances pertinentes et vérifier les sources.
  expected_output: >
    Une synthèse concise accompagnée des liens vers les sources.
  agent: research_agent

content_draft:
  description: >
    Transformer la recherche validée en proposition de publication.
  expected_output: >
    Un brouillon qui ne sera jamais publié sans validation humaine.
  agent: writer_agent

code_change:
  description: >
    Analyser la demande suivante, proposer une modification minimale et sûre,
    puis fournir le patch et les commandes de validation sans exécuter le code :
    {coding_request}
  expected_output: >
    Une explication concise, un patch applicable, les tests recommandés et les
    risques ou hypothèses qui nécessitent une validation humaine.
  agent: coder_agent
