name: Experimental projects checks

on:
  push:
    branches: [main]
    paths:
      - "openclaw-akash-dual-agents/**"
      - "openclaw-inkling-akash/**"
      - "pra/**"
      - "tokenized_llm_finance/**"
      - "scripts/powershell/Test-ScriptSyntax.ps1"
      - "scripts/python/ci_lint_changed.py"
      - "scripts/python/tests/test_ci_lint_changed.py"
      - "scripts/python/ci_changed_components.py"
      - "scripts/python/tests/test_ci_changed_components.py"
      - ".github/workflows/experimental-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "openclaw-akash-dual-agents/**"
      - "openclaw-inkling-akash/**"
      - "pra/**"
      - "tokenized_llm_finance/**"
      - "scripts/powershell/Test-ScriptSyntax.ps1"
      - "scripts/python/ci_lint_changed.py"
      - "scripts/python/tests/test_ci_lint_changed.py"
      - "scripts/python/ci_changed_components.py"
      - "scripts/python/tests/test_ci_changed_components.py"
      - ".github/workflows/experimental-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tokenized: ${{ steps.filter.outputs.tokenized }}
      shell_prototypes: ${{ steps.filter.outputs.shell_prototypes }}
      pra: ${{ steps.filter.outputs.pra }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select relevant checks
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/python/ci_changed_components.py --all --github-output "$GITHUB_OUTPUT"
          else
            python scripts/python/ci_changed_components.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  tokenized-python:
    name: Experimental tokenized finance (Python only)
    needs: changes
    if: needs.changes.outputs.tokenized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tokenized_llm_finance/requirements-ci.txt
      - name: Run Python tests and lint
        working-directory: tokenized_llm_finance
        run: |
          python -m pytest
          python -m ruff check python tests

  tokenized-solidity:
    name: Experimental tokenized finance (Solidity)
    needs: changes
    if: needs.changes.outputs.tokenized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.3
      - name: Install pinned test library and run contracts
        working-directory: tokenized_llm_finance
        run: |
          forge install foundry-rs/forge-std@77041d2ce690e692d6e03cc812b57d1ddaa4d505 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@dbb6104ce834628e473d2173bbc9d47f81a9eec3 --no-git
          forge test -vv

  shell-prototypes:
    name: OpenClaw shell syntax (supplemental)
    needs: changes
    if: needs.changes.outputs.shell_prototypes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell syntax
        run: |
          find openclaw-akash-dual-agents openclaw-inkling-akash -name "*.sh" -print0 \
            | xargs -0 -r -n1 bash -n

  pra-powershell:
    name: Experimental PRA syntax and recovery scenarios
    needs: changes
    if: needs.changes.outputs.pra == 'true'
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate PRA PowerShell syntax
        shell: pwsh
        run: ./scripts/powershell/Test-ScriptSyntax.ps1 -Path ./pra
      - name: Test recovery and failure scenarios offline
        shell: pwsh
        run: ./pra/tests/Test-PraRecovery.ps1
