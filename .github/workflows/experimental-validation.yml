name: Experimental projects checks

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "openclaw-akash-dual-agents/**"
      - "openclaw-inkling-akash/**"
      - "pra/**"
      - "tokenized_llm_finance/**"
      - "project-maturity.toml"
      - ".github/workflows/experimental-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/**"
      - "openclaw-akash-dual-agents/**"
      - "openclaw-inkling-akash/**"
      - "pra/**"
      - "tokenized_llm_finance/**"
      - "project-maturity.toml"
      - ".github/workflows/experimental-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    name: Experimental Akash configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Akash OpenClaw configuration
        run: python deploy/akash-openclaw-doc-agent/scripts/validate.py

  tokenized-python:
    name: Experimental tokenized finance (Python only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tokenized_llm_finance/requirements-dev.txt
      - name: Run Python tests and lint
        working-directory: tokenized_llm_finance
        run: |
          python -m compileall -q python tests
          python -m pytest
          python -m ruff check python tests

  tokenized-solidity:
    name: Experimental tokenized finance (Solidity)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: Install pinned Solidity dependencies
        working-directory: tokenized_llm_finance
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@c64a1edb67b6e3f4a15cca8909c9482ad33a02b0 --no-git
          forge install foundry-rs/forge-std@77041d2ce690e692d6e03cc812b57d1ddaa4d505 --no-git
      - name: Build and test contracts
        working-directory: tokenized_llm_finance
        run: |
          forge build
          forge test

  shell-prototypes:
    name: Experimental OpenClaw shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell syntax
        run: |
          find openclaw-akash-dual-agents openclaw-inkling-akash -name "*.sh" -print0 \
            | xargs -0 -r -n1 bash -n
      - name: Run ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          find openclaw-akash-dual-agents openclaw-inkling-akash -name "*.sh" -print0 \
            | xargs -0 -r shellcheck --severity=error

  pra-powershell:
    name: Experimental PRA syntax
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate PRA PowerShell syntax
        shell: pwsh
        run: ./scripts/powershell/Test-ScriptSyntax.ps1 -Path ./pra
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./pra -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) {
            exit 1
          }
