name: AI Refactor (manual)

on:
  workflow_dispatch:

concurrency:
  group: ai-refactor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.generate.outputs.has_patch }}

    env:
      OPENAI_MODEL: gpt-4.1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq shellcheck

      - id: generate
        name: Ask OpenAI for a small safe patch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not configured."
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tmpctx="$(mktemp)"
          find . -type f \( \
              -name "*.py" -o \
              -name "*.ps1" -o \
              -name "*.psd1" -o \
              -name "*.psm1" -o \
              -name "*.cmd" -o \
              -name "*.sh" -o \
              -name "*.md" -o \
              -name "*.yml" -o \
              -name "*.yaml" \
            \) \
            -not -path "./.git/*" \
            -not -path "./.pytest_cache/*" \
            -not -path "./__pycache__/*" \
            -not -path "./.venv/*" \
            -not -path "./.github/workflows/ai-refactor.yml" \
            -size -200k \
            | sort \
            | head -n 30 \
            | while IFS= read -r file; do
                printf '<<<FILE:%s>>>\n' "$file" >> "$tmpctx"
                sed -e 's/\r$//' "$file" >> "$tmpctx" || true
                printf '\n<<<END>>>\n' >> "$tmpctx"
              done

          jq -n \
            --arg model "$OPENAI_MODEL" \
            --rawfile context "$tmpctx" \
            '{
              model: $model,
              input: [
                {
                  role: "system",
                  content: "You are a senior software engineer. Return only a minimal unified git diff. Do not change public behavior, credentials, or offensive capability. Prefer docs, validation, linting, safety notes, and small bug fixes."
                },
                {
                  role: "user",
                  content: ("Repository sample:\n" + $context + "\nReturn an empty response if no safe improvement is obvious.")
                }
              ],
              temperature: 0,
              max_output_tokens: 4096
            }' > request.json

          curl --fail-with-body --silent --show-error https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            --output response.json

          if jq -e '.error != null' response.json >/dev/null; then
            jq -r '.error.message // "OpenAI returned an unspecified error."' response.json >&2
            exit 1
          fi

          jq -er '[
            .output[]?
            | select(.type == "message")
            | .content[]?
            | select(.type == "output_text")
            | .text
          ] | join("")' response.json > ai.patch

          if [ -s ai.patch ] && grep -Eq '^(diff --git |--- )' ai.patch; then
            git apply --check ai.patch
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            : > ai.patch
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch
        if: steps.generate.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          git apply --whitespace=fix ai.patch

      - name: Validate generated patch
        if: steps.generate.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          python -m compileall .
          python -m unittest discover -s scripts/python/tests -v

      - name: Validate PowerShell syntax
        if: steps.generate.outputs.has_patch == 'true'
        shell: pwsh
        run: ./scripts/powershell/Test-ScriptSyntax.ps1 -Path ./scripts

      - name: Install PSScriptAnalyzer
        if: steps.generate.outputs.has_patch == 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($attempt in 1..3) {
            try {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) {
                throw
              }
              Write-Warning "PSScriptAnalyzer installation attempt $attempt failed. Retrying..."
              Start-Sleep -Seconds 10
            }
          }

      - name: Run PSScriptAnalyzer
        if: steps.generate.outputs.has_patch == 'true'
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) {
            exit 1
          }

      - name: Validate shell scripts
        if: steps.generate.outputs.has_patch == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts -name "*.sh" -print0)
          find scripts -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

      - name: Upload validated patch
        if: steps.generate.outputs.has_patch == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-refactor-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai.patch
          if-no-files-found: error
          retention-days: 1

  create-pull-request:
    needs: generate-and-validate
    if: needs.generate-and-validate.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-refactor-patch-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Apply validated patch
        run: |
          set -euo pipefail
          git apply --check ai.patch
          git apply --whitespace=fix ai.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "AI refactor"
          body: "Manual AI-assisted refactor. Review carefully before merging."
          branch: ai/refactor-${{ github.run_id }}
          commit-message: "AI refactor: automated suggestions"
          delete-branch: true
