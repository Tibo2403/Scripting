name: Usable projects validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      maturity: ${{ steps.filter.outputs.maturity }}
      powershell: ${{ steps.filter.outputs.powershell }}
      bash: ${{ steps.filter.outputs.bash }}
      python: ${{ steps.filter.outputs.python }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select relevant checks
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/python/ci_changed_components.py --all --github-output "$GITHUB_OUTPUT"
          else
            python scripts/python/ci_changed_components.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi

  maturity-catalog:
    name: Project maturity catalog
    needs: changes
    if: needs.changes.outputs.maturity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate project classification
        run: python scripts/python/check_project_maturity.py

  powershell:
    name: PowerShell validation
    needs: changes
    if: needs.changes.outputs.powershell == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./scripts/powershell/Test-ScriptSyntax.ps1 -Path ./scripts

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          foreach ($attempt in 1..3) {
            try {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) {
                throw
              }
              Write-Warning "PSScriptAnalyzer installation attempt $attempt failed. Retrying..."
              Start-Sleep -Seconds 10
            }
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) {
            exit 1
          }

      - name: Run Codex Workspace Doctor smoke test
        shell: pwsh
        run: ./scripts/tests/Test-Optimize-CodexWorkspace.ps1

      - name: Run Codex LiteLLM switch smoke test
        shell: pwsh
        run: ./scripts/tests/Test-Switch-CodexLiteLLM.ps1

  bash:
    name: Bash validation
    needs: changes
    if: needs.changes.outputs.bash == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Smoke sovereign AI installer dry run
        run: bash scripts/bash/install_ia_souveraine.sh --dry-run --gpu off --skip-model

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail
          find scripts -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

      - name: Run Linux safety tests
        run: bash scripts/tests/test-linux-safety.sh

  python:
    name: Python ${{ matrix.python-version }} validation
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: python -m pip install -r scripts/python/requirements.txt

      - name: Validate Python syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts/python -Filter *.py -Recurse | ForEach-Object { $_.FullName }
          python -m py_compile @files

      - name: Run Python tests
        run: python -m unittest discover -s scripts/python/tests -v
