name: OpenClaw CrewAI container

on:
  pull_request:
    paths:
      - "scripts/python/openclaw_crewai_admin/**"
      - ".github/workflows/openclaw-crewai-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Static checks
        run: |
          cd scripts/python/openclaw_crewai_admin
          python3 -m py_compile crewai_admin_mcp.py webhook_proxy.py
          bash -n setup.sh install-secure-container.sh container-entrypoint.sh deploy/install-vm.sh
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/python/openclaw_crewai_admin
          load: true
          push: false
          tags: openclaw-crewai-admin:test
      - name: Runtime smoke test
        run: bash scripts/python/openclaw_crewai_admin/container-smoke-test.sh
