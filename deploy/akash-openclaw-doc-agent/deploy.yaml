version: "2.0"

services:
  agent:
    image: __AGENT_IMAGE__
    env:
      - ADMIN_ENABLED=false
      - REGISTRATION_ENABLED=false
      - PUBLIC_ACCESS=false
      - ALLOW_SHELL=false
      - ALLOW_DOCKER=false
      - ALLOW_TERMINAL=false
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
    params:
      storage:
        workspace:
          mount: /workspace
          readOnly: false
  ollama:
    image: __OLLAMA_IMAGE__
    env:
      - OLLAMA_MODEL=llama3.2:3b-instruct-q4_K_M
    expose:
      - port: 11434
        to:
          - service: agent
    params:
      storage:
        ollama-models:
          mount: /home/agent/.ollama/models
          readOnly: false

profiles:
  compute:
    agent:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - size: 1Gi
          - name: workspace
            size: 5Gi
            attributes:
              persistent: true
              class: beta3
    ollama:
      resources:
        cpu:
          units: 3.5
        memory:
          size: 11Gi
        storage:
          - size: 1Gi
          - name: ollama-models
            size: 28Gi
            attributes:
              persistent: true
              class: beta3
  placement:
    akash:
      pricing:
        agent:
          denom: uact
          amount: 8
        ollama:
          denom: uact
          amount: 42

deployment:
  agent:
    akash:
      profile: agent
      count: 1
  ollama:
    akash:
      profile: ollama
      count: 1
